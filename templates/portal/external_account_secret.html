<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Данные доступа — ManagerSL</title>
    <style>
        body{margin:0;background:#f5f7fb;color:#172033;font:16px/1.5 system-ui,sans-serif}
        main{max-width:560px;margin:8vh auto;padding:24px}
        section{background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:28px;box-shadow:0 12px 32px rgba(23,32,51,.08)}
        h1{font-size:24px;margin:0 0 8px}.muted{color:#667085}.secret{margin:22px 0;padding:16px;border:1px dashed #94a3b8;border-radius:12px;font:600 18px ui-monospace,monospace;overflow-wrap:anywhere}
        a{display:inline-block;color:#fff;background:#0b4a7d;padding:10px 16px;border-radius:10px;text-decoration:none}
    </style>
</head>
<body><main><section>
    <h1>{{ account.provider_name }}</h1>
    <div class="muted">{{ client.full_name }} · {{ account.get_system_display }}</div>
    <div class="secret">{{ secret|default:"Пароль не сохранён" }}</div>
    <p class="muted">Страница не кэшируется. Закройте вкладку после использования.</p>
    <a href="{% url 'portal:client_detail' client.id %}">Вернуться к карточке</a>
</section></main></body>
</html>
