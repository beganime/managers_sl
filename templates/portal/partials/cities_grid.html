<div class="card-grid">
    {% for item in items %}
        <div class="item-card">
            <div style="height:128px; margin:-18px -18px 14px; overflow:hidden; background:linear-gradient(135deg,#dbeafe,#f8fafc); border-radius:8px 8px 0 0; display:grid; place-items:center;">
                <i data-lucide="map-pin" style="width:42px; height:42px; color:#1d4ed8;"></i>
            </div>
            <div class="item-card-top">
                <div>
                    <div class="item-card-title">{{ item.name }}</div>
                    <div class="muted small">{{ item.country.name }}</div>
                </div>
                <span class="pill {% if item.is_active %}ok{% else %}danger{% endif %}">{{ item.is_active|yesno:"Активен,Неактивен" }}</span>
            </div>
            <div class="item-card-meta">
                <span>ВУЗов: {{ item.universities_count }}</span>
                <span>{{ item.description|truncatechars:130|default:"Описание пока не заполнено" }}</span>
            </div>
            <div class="filters">
                <a class="pill" href="{% url 'portal:universities' %}?city={{ item.id }}&view=grid">Открыть</a>
            </div>
        </div>
    {% empty %}
        <div class="empty">Города не найдены.</div>
    {% endfor %}
</div>
