{% if items %}
<div class="list">
    {% for item in items %}
        <div class="list-row">
            <div>
                <div class="strong">{{ item.title }}</div>
                <div class="muted small">{{ item.created_at|date:"Y-m-d H:i" }}</div>
            </div>
            <span class="pill {% if item.read_at %}ok{% else %}warn{% endif %}">{{ item.get_status_display }}</span>
        </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">No notifications.</div>
{% endif %}
