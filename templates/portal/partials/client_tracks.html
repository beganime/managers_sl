<div class="panel-header" style="gap:16px;flex-wrap:wrap"><div><h2 class="panel-title">Кем хотят стать наши клиенты</h2><p class="muted small">Основное направление · доступные вам клиенты, без архива</p></div><span class="pill">{{ track_total }} клиентов</span></div>
<div class="panel-body"><div class="track-grid">{% for item in track_rows %}<article class="track-tile"><div class="track-heading"><span>{{ item.label }}</span><strong>{{ item.count }}</strong></div><div class="track-bar"><span style="width:{{ item.percent }}%"></span></div></article>{% endfor %}</div><p class="muted small" style="margin-top:16px">Направление уточняется в карточке клиента. Каждый клиент учитывается один раз.</p></div>
<style>.track-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.track-tile{border:1px solid var(--line,#dce3eb);border-radius:14px;padding:18px;min-width:0}.track-heading{display:flex;gap:12px;align-items:center;justify-content:space-between}.track-heading span{font-size:14px;overflow-wrap:anywhere}.track-heading strong{font-size:28px;color:var(--text,#0d416d)}.track-bar{height:5px;background:var(--soft,#eef2f6);border-radius:4px;margin-top:18px;overflow:hidden}.track-bar span{display:block;height:100%;background:#0d416d}.track-tile:nth-child(3n+1) .track-bar span{background:#b8201a}@media(max-width:1100px){.track-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.track-grid{grid-template-columns:1fr}}</style>
