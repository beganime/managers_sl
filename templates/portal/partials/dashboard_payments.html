{% if items %}
<div class="list">
    {% for item in items %}
        <div class="list-row">
            <div>
                <div class="strong">{{ item.client.full_name }}</div>
                <div class="muted small">{{ item.payment_date }} · {{ item.method }}</div>
            </div>
            <span class="pill {% if item.is_confirmed %}ok{% else %}warn{% endif %}">${{ item.amount_usd|floatformat:2 }}</span>
        </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">No payments.</div>
{% endif %}
