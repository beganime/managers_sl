{% if items %}
<div class="list">
    {% for item in items %}
        <div class="list-row">
            <div>
                <div class="strong">{{ item.title }}</div>
                <div class="muted small">{{ item.project.title }}{% if item.deadline %} · {{ item.deadline|date:"Y-m-d H:i" }}{% endif %}</div>
            </div>
            <span class="pill {% if item.priority == 'urgent' or item.priority == 'high' %}warn{% endif %}">{{ item.get_status_display }}</span>
        </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">No open tasks.</div>
{% endif %}
