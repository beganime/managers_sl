{% if items %}
<div class="list">
    {% for item in items %}
        <div class="list-row">
            <div>
                <div class="strong">{{ item.full_name }}</div>
                <div class="muted small">{{ item.phone }}{% if item.interested_country %} · {{ item.interested_country }}{% endif %}</div>
            </div>
            <span class="pill">{{ item.get_status_display }}</span>
        </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">No leads.</div>
{% endif %}
