{% if items %}
<div class="list">
    {% for item in items %}
        <div class="list-row">
            <div>
                <div class="strong">{{ item.display_title }}</div>
                <div class="muted small">{% if item.client %}{{ item.client.full_name }}{% else %}No client{% endif %}</div>
            </div>
            <span class="pill {% if item.status == 'approved' %}ok{% elif item.status == 'rejected' or item.status == 'error' %}danger{% else %}warn{% endif %}">{{ item.get_status_display }}</span>
        </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">No documents.</div>
{% endif %}
