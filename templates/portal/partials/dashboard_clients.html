{% if items %}
<div class="list">
    {% for item in items %}
        <div class="list-row">
            <div>
                <div class="strong">{{ item.full_name }}</div>
                <div class="muted small">{{ item.phone }}{% if item.city %} · {{ item.city }}{% endif %}</div>
            </div>
            <span class="pill {% if item.is_priority %}warn{% endif %}">{{ item.get_status_display }}</span>
        </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">No clients.</div>
{% endif %}
