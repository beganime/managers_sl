<section class="panel" style="margin-bottom:24px;border-left:4px solid #207960"><div class="panel-body"><small class="muted">НАСТРОЙ НА ДЕНЬ</small><h2 style="margin:8px 0;font-weight:650">{{ daily_encouragement }}</h2></div></section>
<div class="filters" style="margin-bottom:24px">
{% if team_admin %}<a class="btn" href="{% url 'portal:staff_metrics' %}">Показатели сотрудников</a><a class="btn" href="{% url 'portal:staff_suggestions' %}">Пожелания команды</a>{% endif %}
<button class="btn" type="button" onclick="document.getElementById('daily-suggestion').showModal()">Предложить улучшение сайта</button></div>
<dialog id="daily-suggestion" aria-labelledby="suggestion-title"><h2 id="suggestion-title">Что сделать удобнее?</h2><p>Какого улучшения вам не хватает? Пожелание увидит только администратор.</p><form method="post" action="{% url 'portal:suggestion' %}">{% csrf_token %}<label for="daily-idea">Ваше пожелание</label><textarea id="daily-idea" class="textarea" name="text" maxlength="1000" minlength="3" required rows="4" placeholder="Например: добавить поиск по номеру договора"></textarea><div class="filters" style="margin-top:18px"><button class="btn primary" type="submit">Отправить</button><button class="btn" type="button" onclick="document.getElementById('daily-suggestion').close()">Не сейчас</button></div></form></dialog>
<style>#daily-suggestion{border:1px solid #dce5eb;border-radius:20px;padding:28px;max-width:520px;width:calc(100% - 32px);max-height:85vh;overflow:auto;color:#20364b}#daily-suggestion::backdrop{background:rgba(15,30,45,.45)}#daily-suggestion textarea{width:100%}</style>
{% if ask_suggestion %}<script>document.getElementById('daily-suggestion').showModal();</script>{% endif %}
