{% if items %}
<div class="list">
    {% for item in items %}
        <div class="list-row">
            <div>
                <div class="strong">{{ item.client.full_name }}</div>
                <div class="muted small">{{ item.university_name|default:"University not selected" }}{% if item.program_name %} · {{ item.program_name }}{% endif %}</div>
            </div>
            <span class="pill">{{ item.get_status_display }}</span>
        </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">No applications.</div>
{% endif %}
