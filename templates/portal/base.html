<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | ManagerSL ERP</title>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --panel-2: #f1f5f3;
            --text: #17201c;
            --muted: #66746e;
            --line: #dce3df;
            --accent: #176b53;
            --accent-2: #0e4f8a;
            --danger: #b42318;
            --warn: #a15c07;
            --ok: #137333;
            --shadow: 0 1px 2px rgba(16, 24, 40, .06);
        }
        * { box-sizing: border-box; }
        html { color-scheme: light; }
        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            letter-spacing: 0;
        }
        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font: inherit; }
        .shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            background: #10231d;
            color: #f8faf9;
            border-right: 1px solid #17362d;
            padding: 18px 14px;
            overflow-y: auto;
        }
        .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #d7f2e7;
            color: #0f4a39;
            display: grid;
            place-items: center;
            font-weight: 800;
        }
        .brand-title { font-size: 15px; font-weight: 750; }
        .brand-subtitle { font-size: 12px; color: #b9c8c2; margin-top: 1px; }
        .nav { display: grid; gap: 4px; }
        .nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 38px;
            padding: 8px 10px;
            border-radius: 8px;
            color: #d9e5e1;
        }
        .nav a:hover, .nav a.active { background: #173b31; color: #ffffff; }
        .nav svg, .icon { width: 18px; height: 18px; flex: 0 0 18px; }
        .content { min-width: 0; }
        .topbar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 28px;
            background: rgba(246, 247, 249, .9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .topbar h1 { margin: 0; font-size: 22px; font-weight: 760; }
        .topbar-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
        .main { padding: 24px 28px 40px; }
        .mobile-menu { display: none; }
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .panel-title { font-size: 15px; font-weight: 720; margin: 0; }
        .panel-body { padding: 16px; }
        .grid { display: grid; gap: 16px; }
        .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .metric-grid { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .metric {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px;
            min-height: 92px;
            box-shadow: var(--shadow);
            display: grid;
            align-content: space-between;
        }
        .metric-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
        .metric-value { font-size: 26px; font-weight: 780; margin-top: 12px; }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .input, .select, .textarea {
            width: 100%;
            min-height: 38px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text);
            outline: none;
        }
        .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23, 107, 83, .12); }
        .search-input { width: min(360px, 100%); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn:hover { border-color: #b9c4bf; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.secondary { background: #ecf4f1; border-color: #cfe1da; color: #0f4a39; }
        .btn.danger { background: #fff3f0; border-color: #f3b8ad; color: var(--danger); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 760px; }
        th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
        th { color: var(--muted); font-size: 12px; font-weight: 720; background: #fbfcfb; }
        td { font-size: 13px; }
        tr:last-child td { border-bottom: 0; }
        .muted { color: var(--muted); }
        .strong { font-weight: 720; }
        .small { font-size: 12px; }
        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 12px;
            color: #34423d;
            background: #eef3f1;
            border: 1px solid #dce6e2;
            white-space: nowrap;
        }
        .pill.ok { background: #eaf7ee; color: var(--ok); border-color: #c9ead2; }
        .pill.warn { background: #fff6e7; color: var(--warn); border-color: #f3d6a5; }
        .pill.danger { background: #fff0ed; color: var(--danger); border-color: #f4c4ba; }
        .empty { padding: 24px; text-align: center; color: var(--muted); }
        .list { display: grid; gap: 10px; }
        .list-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }
        .list-row:last-child { border-bottom: 0; }
        .messages { display: grid; gap: 8px; margin-bottom: 14px; }
        .message { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
        .message.success { border-color: #bde6ca; background: #eefaf2; }
        .message.error { border-color: #efb8ad; background: #fff3f0; }
        [x-cloak] { display: none !important; }
        @media (max-width: 1180px) {
            .metric-grid { grid-template-columns: repeat(4, minmax(120px, 1fr)); }
            .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 860px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed;
                inset: 0 auto 0 0;
                width: 280px;
                z-index: 30;
                transform: translateX(-100%);
                transition: transform .18s ease;
            }
            .sidebar.open { transform: translateX(0); }
            .mobile-menu { display: inline-flex; }
            .topbar { padding: 0 16px; }
            .main { padding: 18px 16px 32px; }
            .metric-grid, .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
            .toolbar { align-items: stretch; flex-direction: column; }
            .filters { width: 100%; }
            .search-input { width: 100%; }
        }
    </style>
</head>
<body x-data="{ sidebarOpen: false }" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="shell">
        <aside class="sidebar" :class="{ 'open': sidebarOpen }" @click.outside="sidebarOpen = false">
            <div class="brand">
                <div class="brand-mark">SL</div>
                <div>
                    <div class="brand-title">ManagerSL</div>
                    <div class="brand-subtitle">ERP cabinet</div>
                </div>
            </div>
            <nav class="nav">
                {% for item in nav_items %}
                    <a href="{{ item.url }}" class="{% if item.name == active_page %}active{% endif %}" @click="sidebarOpen = false">
                        <i data-lucide="{{ item.icon }}"></i>
                        <span>{{ item.label }}</span>
                    </a>
                {% endfor %}
            </nav>
        </aside>

        <div class="content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:12px;">
                    <button type="button" class="btn mobile-menu" @click="sidebarOpen = true" aria-label="Open navigation">
                        <i data-lucide="menu"></i>
                    </button>
                    <h1>{{ page_title }}</h1>
                </div>
                <div class="topbar-meta">
                    <span class="pill">{{ unread_notifications_count }} unread</span>
                    <span>{{ display_name }}</span>
                </div>
            </header>

            <main class="main">
                {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                            <div class="message {{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide) window.lucide.createIcons();
        });
        document.body.addEventListener('htmx:afterSwap', function () {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
