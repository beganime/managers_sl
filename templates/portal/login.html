<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | ManagerSL ERP</title>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #17201c;
            --muted: #66746e;
            --line: #dce3df;
            --accent: #176b53;
            --danger: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 24px;
        }
        .login-shell {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(16, 24, 40, .12);
            padding: 24px;
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: #d7f2e7;
            color: #0f4a39;
            display: grid;
            place-items: center;
            font-weight: 800;
        }
        h1 { font-size: 24px; margin: 0 0 4px; }
        p { margin: 0; color: var(--muted); }
        form { display: grid; gap: 14px; }
        label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
        input {
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 11px;
            outline: none;
            font: inherit;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23, 107, 83, .12); }
        .btn {
            min-height: 42px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            font: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
        .errors {
            border: 1px solid #efb8ad;
            background: #fff3f0;
            color: var(--danger);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
        }
        .footer { margin-top: 16px; font-size: 13px; color: var(--muted); }
        .footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="brand">
            <div class="brand-mark">SL</div>
            <div>
                <h1>ManagerSL</h1>
                <p>Веб-кабинет ERP/CRM/HRM</p>
            </div>
        </div>

        {% if form.errors %}
            <div class="errors">Не удалось войти. Проверьте email и пароль.</div>
        {% endif %}
        {% if request.GET.csrf_error %}
            <div class="errors">Сессия формы устарела. Страница обновлена, попробуйте войти ещё раз.</div>
        {% endif %}

        <form method="post" action="{% url 'portal:login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label>
                Email
                <input type="email" name="username" autocomplete="username" required autofocus>
            </label>
            <label>
                Пароль
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="btn" type="submit"><i data-lucide="log-in"></i>Войти</button>
        </form>

        <div class="footer">
            Админка остаётся доступна отдельно: <a href="/admin/">/admin/</a>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
