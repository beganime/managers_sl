{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | ManagerSL</title>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <style>
        :root {
            --bg: #111827;
            --panel: #ffffff;
            --text: #172033;
            --muted: #687386;
            --line: #dce2e9;
            --accent: #b71d17;
            --accent-dark: #8f1511;
            --link: #0d416d;
            --danger: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% 10%, rgba(13, 65, 109, .34), transparent 38%),
                linear-gradient(145deg, #111827 0%, #1e293b 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 24px;
        }
        .login-shell {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, .22);
            padding: 30px;
        }
        .brand {
            display: grid;
            justify-items: center;
            text-align: center;
            gap: 10px;
            margin-bottom: 26px;
        }
        .brand-mark {
            width: 72px;
            height: 72px;
            border-radius: 14px;
            background: #fff;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px solid var(--line);
        }
        .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
        h1 { font-size: 24px; margin: 0 0 4px; }
        p { margin: 0; color: var(--muted); }
        form { display: grid; gap: 14px; }
        label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
        input {
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 11px;
            outline: none;
            font: inherit;
        }
        input:focus { border-color: var(--link); box-shadow: 0 0 0 3px rgba(13, 65, 109, .14); }
        .btn {
            min-height: 42px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            font: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
        .errors {
            border: 1px solid #efb8ad;
            background: #fff3f0;
            color: var(--danger);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
        }
        @media (max-width: 520px) {
            body { padding: 16px; }
            .login-shell { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="brand">
            <div class="brand-mark"><img src="{% static 'logo.ico' %}" alt="Students Life"></div>
            <div>
                <h1>ManagerSL</h1>
                <p>Рабочий кабинет Students Life</p>
            </div>
        </div>

        {% if form.errors %}
            <div class="errors">Не удалось войти. Проверьте email и пароль.</div>
        {% endif %}
        {% if request.GET.csrf_error %}
            <div class="errors">Сессия формы устарела. Страница обновлена, попробуйте войти ещё раз.</div>
        {% endif %}

        <form method="post" action="{% url 'portal:login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label>
                Email
                <input type="email" name="username" autocomplete="username" required autofocus>
            </label>
            <label>
                Пароль
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="btn" type="submit"><i data-lucide="log-in"></i>Войти</button>
        </form>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
