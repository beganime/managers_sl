{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status_code }} · ManagerSL</title>
    <link rel="icon" href="{% static 'logo.ico' %}">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <style>
        :root { --red:#b71d17; --blue:#0d416d; --ink:#172033; --muted:#687386; --line:#dce2e9; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#eef2f6; }
        .error-shell { min-height:100vh; display:grid; place-items:center; padding:28px 18px; position:relative; overflow:hidden; }
        .error-shell::before,.error-shell::after { content:""; position:absolute; border-radius:999px; filter:blur(2px); pointer-events:none; }
        .error-shell::before { width:420px; height:420px; left:-190px; top:-180px; background:rgba(13,65,109,.09); }
        .error-shell::after { width:340px; height:340px; right:-160px; bottom:-150px; background:rgba(183,29,23,.09); }
        .error-card { width:min(720px,100%); background:#fff; border:1px solid var(--line); border-radius:22px; padding:clamp(28px,6vw,56px); box-shadow:0 24px 70px rgba(15,23,42,.12); position:relative; z-index:1; }
        .brand { display:flex; align-items:center; gap:12px; margin-bottom:44px; }
        .brand img { width:46px; height:46px; object-fit:contain; background:#fff; border-radius:12px; border:1px solid var(--line); padding:4px; }
        .brand strong { display:block; font-size:16px; }
        .brand span { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
        .error-icon { width:66px; height:66px; display:grid; place-items:center; border-radius:18px; color:#fff; background:linear-gradient(145deg,var(--blue),#17649b); box-shadow:0 14px 30px rgba(13,65,109,.22); margin-bottom:24px; }
        .error-icon svg { width:30px; height:30px; }
        .eyebrow { color:var(--red); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
        h1 { margin:10px 0 14px; font-size:clamp(28px,5vw,42px); line-height:1.08; letter-spacing:-.035em; }
        p { margin:0; color:var(--muted); font-size:16px; line-height:1.65; max-width:590px; }
        .detail { margin-top:16px; padding:14px 16px; border-radius:12px; background:#f5f7f9; border:1px solid var(--line); color:#384456; font-size:14px; }
        .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:30px; }
        .btn { min-height:44px; padding:10px 16px; border:1px solid var(--line); border-radius:10px; display:inline-flex; align-items:center; justify-content:center; gap:8px; color:var(--ink); text-decoration:none; font-weight:700; background:#fff; }
        .btn.primary { background:var(--red); border-color:var(--red); color:#fff; }
        .btn:hover { transform:translateY(-1px); }
        .code { position:absolute; right:30px; top:24px; color:#d8dee7; font-weight:850; font-size:54px; letter-spacing:-.06em; }
        @media (max-width:560px) { .error-card{padding:26px 22px;border-radius:16px}.brand{margin-bottom:34px}.actions{display:grid}.btn{width:100%}.code{font-size:40px;right:22px} }
    </style>
</head>
<body>
<main class="error-shell">
    <section class="error-card">
        <span class="code">{{ status_code }}</span>
        <div class="brand"><img src="{% static 'logo.ico' %}" alt="Students Life"><div><strong>ManagerSL</strong><span>Students Life</span></div></div>
        <div class="error-icon"><i data-lucide="{{ icon }}"></i></div>
        <div class="eyebrow">{{ eyebrow }}</div>
        <h1>{{ title }}</h1>
        <p>{{ description }}</p>
        {% if detail %}<div class="detail">{{ detail }}</div>{% endif %}
        <div class="actions">
            <a class="btn" href="{{ back_url }}"><i data-lucide="arrow-left"></i>Вернуться назад</a>
            <a class="btn primary" href="{{ primary_url }}"><i data-lucide="log-in"></i>{{ primary_label }}</a>
        </div>
    </section>
</main>
<script>document.addEventListener('DOMContentLoaded',function(){if(window.lucide)window.lucide.createIcons();});</script>
</body>
</html>
