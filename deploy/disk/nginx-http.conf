server {
    listen 80;
    listen [::]:80;
    server_name disk.manager-sl.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://disk.manager-sl.ru$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name disk.manager-sl.ru;
    port_in_redirect off;

    ssl_certificate /etc/letsencrypt/live/disk.manager-sl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/disk.manager-sl.ru/privkey.pem;

    client_max_body_size 50m;

    location = / {
        return 302 https://disk.manager-sl.ru/web/client/login;
    }

    # Private machine-to-machine endpoint used after a client is approved.
    # The bridge validates a separate bearer token and never exposes S3 keys.
    location = /api/internal/disk/folders {
        proxy_pass http://127.0.0.1:8111/internal/folders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /api/internal/disk/files {
        proxy_pass http://127.0.0.1:8111/internal/files;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Activity is available only to an authenticated DiskSL WebClient session.
    location = /web/client/disksl/activity {
        auth_request /_disk_session_check;
        proxy_pass http://127.0.0.1:8111/activity/recent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /web/client/disksl/usage {
        auth_request /_disk_session_check;
        proxy_pass http://127.0.0.1:8111/storage/usage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /_disk_session_check {
        internal;
        proxy_pass http://127.0.0.1:8110/web/client/profile;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = /_disk_auth_denied;
    }

    location = /_disk_auth_denied {
        internal;
        return 401;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Keep the upstream WebClient intact and add only the DiskSL search/filter helper.
        sub_filter_once on;
        sub_filter '</body>' '<script src="/static/branding/disksl.js"></script></body>';
    }
}
